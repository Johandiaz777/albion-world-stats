name: stats
# Estadísticas de Albion World desde el historial del scraper de kills. Cada hora rehace HOY; una
# vez al día (01:20 UTC, o si faltan días por completar) cierra los días, completa hacia atrás y
# rearma los índices. Ramas: `rollups` (un archivo por día y región, SOLO se agregan), `index` y
# `today` (un solo commit reescrito con push -f: no crecen ni pueden tener conflictos).
# Parte 63: el cron de GitHub descartaba corridas (el 03/10, 2 de 12 entre las 10:34 y las 22:20 UTC) y el
# índice de "hoy" quedaba horas sin actualizar. Como el escáner, cada corrida encadena la siguiente
# (`mode: auto` espera al minuto 20 de la hora y decide horaria o diaria como el cron); el cron queda
# de respaldo por si la cadena se corta, y `concurrency` deja una sola en cola.
on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'hourly, daily o auto (espera al minuto 20 y decide como el cron)'
        default: 'daily'
concurrency:
  group: stats
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    # Hasta 59 min esperando el minuto 20 (mode auto) + la construcción.
    timeout-minutes: 120
    env:
      REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - name: Esperar al minuto 20 (cadena)
        if: github.event.inputs.mode == 'auto'
        run: |
          s=$(( ( (20 - 10#$(date -u +%M) + 60) % 60 ) * 60 - 10#$(date -u +%S) ))
          [ "$s" -le 0 ] && s=$(( s + 3600 ))
          echo "espera $s s"
          sleep "$s"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Traer lo publicado
        run: |
          for b in rollups index today; do
            rm -rf "$b"
            if git clone -q --depth 1 -b "$b" "$REPO_URL" "$b" 2>/dev/null; then :; else mkdir -p "$b" && git -C "$b" init -q -b "$b"; fi
          done
      - name: Construir
        run: |
          MODE="${{ github.event.inputs.mode }}"
          [ "$MODE" = "auto" ] && MODE=""
          if [ -z "$MODE" ]; then
            HORA=$(date -u +%H)
            # Diario a la 01 UTC, o si la última corrida diaria dejó días por completar.
            # Parte 89: si la última diaria falló (p. ej. sin memoria) el índice publicado queda viejo: se reintenta
            # la próxima hora en vez de esperar a la 01 UTC del día siguiente.
            PEND=$(node -e "try{const s=require('./index/status.json');const old=Date.now()-Date.parse(s.generatedAt)>26*3600e3;console.log(old||Object.values(s.regions||{}).some(r=>r.daysPending>0||r.nameIndexPending>0||r.pidsPending!==0)?1:0)}catch{console.log(1)}")
            if [ "$HORA" = "01" ] || [ "$PEND" = "1" ]; then MODE=daily; else MODE=hourly; fi
          fi
          echo "modo: $MODE"
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          # Auditoría p60: solo se publica lo que terminó bien. Si una corrida muere a mitad de escribir
          # las partes, lo publicado sigue siendo la versión completa anterior (antes se subía a medias).
          # Parte 89: la diaria de Américas pasó los 4 GB que Node usa por defecto (OOM desde el 07/10): 12 GB
          # de los 16 del runner.
          if node build.mjs hourly; then touch .hourly-ok; else echo "::warning::hourly falló"; fi
          if [ "$MODE" = "daily" ]; then if node --max-old-space-size=12288 build.mjs daily; then touch .daily-ok; else echo "::warning::daily falló"; fi; fi
      - name: Publicar
        run: |
          publicar_forzado() {
            if grep -rlI -e '^<<<<<<< ' -e '^>>>>>>> ' "$1" --exclude-dir=.git >/dev/null 2>&1; then echo "::error::conflicto en $1"; return 0; fi
            ( cd "$1" && rm -rf .git && git init -q -b "$1" && git config user.name stats && git config user.email stats@users.noreply.github.com \
              && git add -A && git commit -q -m "$1 $(date -u +%FT%TZ)" && git push -q -f "$REPO_URL" "$1" ) || echo "::warning::push de $1 falló"
          }
          if [ -f .hourly-ok ]; then publicar_forzado today; else echo "::warning::today sin publicar (hourly no terminó)"; fi
          # El índice (~100 MB) solo cambia en la corrida diaria: no se re-sube cada hora.
          if [ "$MODE" = "daily" ] && [ -f .daily-ok ] && [ -f index/status.json ]; then publicar_forzado index; fi
          if [ -n "$(git -C rollups status --porcelain)" ]; then
            git -C rollups config user.name stats && git -C rollups config user.email stats@users.noreply.github.com
            git -C rollups add -A && git -C rollups commit -q -m "rollups $(date -u +%F)" && git -C rollups push -q "$REPO_URL" HEAD:rollups || echo "::warning::push de rollups falló"
          fi

      # Encadena la próxima hora sin depender del cron. `always()`: la cadena no se corta aunque esta
      # corrida haya fallado (la siguiente vuelve a intentar).
      - name: Encadenar la próxima hora
        if: always()
        run: |
          curl -sf -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/stats.yml/dispatches" -d '{"ref":"${{ github.ref_name }}","inputs":{"mode":"auto"}}' || echo "::warning::no se pudo encadenar (queda el cron)"
